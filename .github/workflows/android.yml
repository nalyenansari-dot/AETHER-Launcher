name: Build AETHER Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Fix submodule URLs
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Download Engine
        run: git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git engine

      - name: Apply AETHER Branding
        working-directory: engine
        run: |
          sed -i "s/resValue 'string', 'app_name', 'Amethyst (Debug)'/resValue 'string', 'app_name', 'AETHER Launcher'/g" app_pojavlauncher/build.gradle
          sed -i 's/resValue "string", "app_name", "Amethyst (Debug)"/resValue "string", "app_name", "AETHER Launcher"/g' app_pojavlauncher/build.gradle
          sed -i 's/resValue "string", "app_name", "Amethyst"/resValue "string", "app_name", "AETHER Launcher"/g' app_pojavlauncher/build.gradle
          sed -i 's/#181818/#041d1b/g; s/#242424/#061f1f/g; s/#232323/#061f1f/g; s/#464646/#123b35/g' app_pojavlauncher/src/main/res/values/colors.xml

      - name: Build APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Launcher-APK
          path: engine/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
