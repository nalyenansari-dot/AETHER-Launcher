name: Build AETHER Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AETHER repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Zalith Launcher 2
        run: |
          git clone --depth 1 \
            https://github.com/ZalithLauncher/ZalithLauncher2.git \
            zalith

      - name: Set AETHER app name
        working-directory: zalith
        run: |
          grep -n -i "app.*name\|name.*app" gradle.properties || true
          echo "Source downloaded. Check gradle.properties before changing branding."

      - name: Build APK
        working-directory: zalith
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-test-APK
          path: zalith/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
