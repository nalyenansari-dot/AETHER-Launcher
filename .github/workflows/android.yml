name: Build AETHER Engine APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix public submodule URLs
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Download Amethyst Engine
        run: git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git amethyst-engine

      - name: Build APK
        working-directory: amethyst-engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-engine-debug-apk
          path: amethyst-engine/app_pojavlauncher/build/outputs/apk/debug/*.apk
