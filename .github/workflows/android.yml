name: Build AETHER Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Rust Android Targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Download Zalith Launcher 2
        run: |
          git clone --recursive \
            https://github.com/ZalithLauncher/ZalithLauncher2.git zalith

      - name: Find Branding and UI Resources
        working-directory: zalith
        run: |
          echo "=== Project modules ==="
          find . -maxdepth 3 \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle.kts" \) \
            -not -path "*/build/*" | head -80

          echo "=== App name ==="
          grep -Rni "app_name" . \
            --include="strings.xml" \
            --exclude-dir=build | head -50 || true

          echo "=== Compose screens ==="
          grep -Rnl "@Composable" . \
            --include="*.kt" \
            --exclude-dir=build | head -80 || true

          echo "=== Skin and cape support ==="
          grep -RniE "skin|cape" . \
            --include="*.kt" \
            --exclude-dir=build | head -80 || true

      - name: Build APK
        working-directory: zalith
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-test-APK
          path: zalith/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
