name: Build AETHER Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Git submodule URLs
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Download Zalith Launcher 2
        run: |
          git clone --recursive \
            https://github.com/ZalithLauncher/ZalithLauncher2.git zalith

      - name: Build APK
        working-directory: zalith
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-test-APK
          path: zalith/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
